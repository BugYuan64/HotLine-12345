server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MinIO 附件访问（同源反代：局域网同事通过当前站点地址直接预览附件）
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # 后端 API 反代（SSE 需关闭缓冲）
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端本地静态导出（分类规则导出等 Excel，WebMvcConfig 映射 ./exports/**）
    location /exports/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 后端本地静态上传（未走 MinIO 的上传文件，WebMvcConfig 映射 ./uploads/**）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}